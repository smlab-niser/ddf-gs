# Task A: surface-ratio ablation on the bull.
# surface_n_ratio = 0.2  (matches the current/default GSSupervisor behaviour:
#   image_size=64 -> n_view=8192, batch=4096 -> n_surf=2048 -> 20% of pool).
# All other settings match the bull_ddf_v3 baseline (256x6, 30k steps).

device: cuda
out_dir: runs/bull_ddf_surf20

steps: 30000
batch_size: 4096
lr: 5.0e-4
log_every: 500
save_every: 10000

lambda_vis: 0.1

supervisor:
  type: gs
  gs_path: runs/bull/gaussians.pt
  image_size: 64
  surface_n_ratio: 0.2

model:
  pos_freqs: 10
  dir_freqs: 4
  hidden_dim: 256
  num_layers: 6
