# Stage-3 latency variant: smaller MLP (hidden=128, layers=4) trained on the bull.
# Same supervisor (v3 — 2-view + surface-anchored) as the bull_ddf_v3 baseline so
# Chamfer can be compared apples-to-apples.

device: cuda
out_dir: runs/bull_ddf_small

steps: 30000
batch_size: 4096
lr: 5.0e-4
log_every: 500
save_every: 10000

lambda_vis: 0.1

supervisor:
  type: gs
  gs_path: runs/bull/gaussians.pt
  image_size: 64

model:
  pos_freqs: 10
  dir_freqs: 4
  hidden_dim: 128
  num_layers: 4
