# Garden table DDF WITH surface-anchored supervision (downsampled 150k GS so the
# 1x1 surface rasterization doesn't OOM/crash like it did at 527k). Surface rays
# make surface-origin occlusion (GI shadow/AO) in-distribution -> faithful GI.

device: cuda
out_dir: runs/counter_obj/ddf_surf

steps: 20000
batch_size: 8192
lr: 2.0e-3
lr_schedule: cosine
lr_min_ratio: 0.05
log_every: 500
save_every: 5000

lambda_vis: 0.3

supervisor:
  type: gs
  gs_path: runs/counter_obj_ds/gaussians.pt
  image_size: 96
  surface_n_ratio: 0.4
  surface_chunk: 8192
  march_ratio: 0.5

model:
  type: hashgrid
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 18
  feat_dim: 2
  log2_table_size: 20
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
