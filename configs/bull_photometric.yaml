# Stage 13: hash-grid DDF + parallel RGB head + photometric supervision.
# Identical to bull_hashgrid.yaml except for:
#   - supervisor.type: gs_photometric (yields rgb_gt alongside depth)
#   - model.type: hashgrid_photometric (adds 3-output sigmoid RGB head)
#   - lambda_rgb: 0.5 (weight on L1 RGB loss at hit pixels)

device: cuda
out_dir: runs/ddf_photometric/bull

steps: 30000
batch_size: 4096
lr: 1.0e-3
log_every: 500
save_every: 10000

lambda_vis: 0.1
lambda_rgb: 0.5

supervisor:
  type: gs_photometric
  gs_path: runs/bull/gaussians.pt
  image_size: 64

model:
  type: hashgrid_photometric
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
