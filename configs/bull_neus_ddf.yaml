# DDF distilled from NeuS SDF (not GS depth).
# Uses sphere-tracing through the trained NeuS-facto SDF for clean supervision.
# Same hash-grid DDF architecture as kitchen-sink, same training recipe.
device: cuda
out_dir: runs/bull_ddf_neus_v2

steps: 60000
batch_size: 16384
lr: 3.0e-3
lr_schedule: cosine
lr_min_ratio: 0.05
log_every: 1000
save_every: 10000

lambda_vis: 0.3

supervisor:
  type: neus
  neus_config_path: runs/sota_comparison_30k/bull/neus/bull/neus-facto/2026-05-25_072619/config.yml
  bbox_half: 1.2
  march_ratio: 0.5
  image_size: 128
  surface_ratio: 0.3
  st_max_iter: 64
  st_eps: 0.001
  st_t_far: 5.0
  camera_r_min: 1.5
  camera_r_max: 3.0

model:
  type: hashgrid
  pos_freqs: 10
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
