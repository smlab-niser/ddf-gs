# GT-mesh ray-cast supervision — the 23ddf recipe. Tests whether the DDF
# architecture captures thin features (legs, horns) given perfect supervision.
device: cuda
out_dir: runs/bull_ddf_gtmesh

steps: 60000
batch_size: 16384
lr: 3.0e-3
lr_schedule: cosine
lr_min_ratio: 0.05
log_every: 2000
save_every: 20000

lambda_vis: 0.3

loss:
  gamma_eikonal: 0.05

supervisor:
  type: gtmesh
  gt_mesh_path: data/gso/Schleich_Hereford_Bull/meshes/model.obj
  gs_path: runs/bull/gaussians.pt
  march_ratio: 0.5
  surface_ratio: 0.5
  gso_rotate: false

model:
  type: hashgrid
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
