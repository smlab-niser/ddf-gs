device: cuda
out_dir: runs/turtle_ddf_color

steps: 60000
batch_size: 16384
lr: 3.0e-3
lr_schedule: cosine
lr_min_ratio: 0.05
log_every: 1000
save_every: 10000

lambda_vis: 0.3
lambda_rgb: 1.0

loss:
  gamma_eikonal: 0.05

color:
  views_dir: runs/turtle/views
  n_rays: 512
  warmup_steps: 5000

supervisor:
  type: gs
  gs_path: runs/turtle_50k/gaussians.pt
  image_size: 256
  march_ratio: 0.5

model:
  type: hashgrid_color
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  color_hidden_dim: 64
  color_num_layers: 3
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
