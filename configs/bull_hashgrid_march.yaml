# Ray-march self-consistency: replace 30% of the batch with marched copies of
# hit rays — DDF(o + s*d, d) = t_gt - s. This is the 23ddf canonical trick
# that makes the field self-consistent along ray directions.

device: cuda
out_dir: runs/bull_ddf_hashgrid_march

steps: 30000
batch_size: 8192
lr: 2.0e-3
lr_schedule: cosine
lr_min_ratio: 0.1
log_every: 500
save_every: 5000

lambda_vis: 0.2

supervisor:
  type: gs
  gs_path: runs/bull/gaussians.pt
  image_size: 128
  march_ratio: 0.3

model:
  type: hashgrid
  pos_freqs: 10
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
