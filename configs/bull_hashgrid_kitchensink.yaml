# Kitchen-sink: stacks all proven DDF improvements.
#  - march_ratio 0.5 (the breakthrough that took bull CD 0.117 -> 0.076)
#  - hi-res supervisor (img=256, batch=16384, LR scaled to 3e-3 + cosine)
#  - 60k steps (vs default 30k)
#  - 50k-Gaussian source GS (vs 5k) for sharper supervision signal
#
# Goal: close the gap to NeuS @ 30k (CD 0.022). Bull baseline 0.117 -> ray-march
# alone 0.076. Stacking should push closer.

device: cuda
out_dir: runs/bull_ddf_hashgrid_kitchensink

steps: 60000
batch_size: 16384
lr: 3.0e-3
lr_schedule: cosine
lr_min_ratio: 0.05
log_every: 1000
save_every: 10000

lambda_vis: 0.3

supervisor:
  type: gs
  gs_path: runs/bull_50k/gaussians.pt
  image_size: 256
  march_ratio: 0.5

model:
  type: hashgrid
  pos_freqs: 10
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
