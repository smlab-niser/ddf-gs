device: cuda
out_dir: runs/mug_ddf_gtmesh_combined
steps: 60000
batch_size: 16384
lr: 3.0e-3
lr_schedule: cosine
lr_min_ratio: 0.05
log_every: 5000
save_every: 20000
lambda_vis: 0.3
loss:
  gamma_eikonal: 0.05
supervisor:
  type: gtmesh
  gt_mesh_path: data/gso/ACE_Coffee_Mug_Kristen_16_oz_cup/meshes/model.obj
  gs_path: runs/mug/gaussians.pt
  march_ratio: 0.5
  frustum_ratio: 0.5
  image_size: 128
  gso_rotate: false
model:
  type: hashgrid
  dir_freqs: 4
  hidden_dim: 64
  num_layers: 2
  n_levels: 16
  feat_dim: 2
  log2_table_size: 19
  base_res: 16
  growth: 1.5
  bbox_half: 1.2
